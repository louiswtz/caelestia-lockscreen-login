name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems** (e.g. something reachable before the lock screen) go through
        private reporting instead: Security tab → "Report a vulnerability".
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and its full output. If it changes something, run it again with `--dry-run`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `./caelestia-lockscreen-login.sh status`
      render: shell
    validations:
      required: true
  - type: dropdown
    id: boot
    attributes:
      label: Boot setup
      options:
        - systemd-boot entries
        - systemd-boot with sdboot-manage
        - UKI (mkinitcpio)
        - UKI (kernel-install / ukify)
        - UKI (dracut)
        - GRUB
        - Limine
        - Limine with /etc/default/limine (CachyOS)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro
      placeholder: Arch Linux, Fedora 42, Ubuntu 26.04…
    validations:
      required: true
  - type: dropdown
    id: hyprconfig
    attributes:
      label: caelestia user config
      options:
        - hypr-user.lua (Lua)
        - hypr-user.conf (classic)
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Login shell
      description: "Output of `getent passwd $USER | cut -d: -f7`"
      placeholder: /usr/bin/fish
  - type: checkboxes
    id: setup
    attributes:
      label: Your machine
      options:
        - label: The disk is encrypted (LUKS)
        - label: Secure Boot is on
        - label: Silent boot is set up
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit you are using
      placeholder: v0.1.0
